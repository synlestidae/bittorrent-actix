[package]
name = "bittorrent-actix"
version = "0.1.0"
edition = "2024"

[dependencies]
actix = "0.13.5"
actix-rt = "2.10.0"
bitvec = "1.0.1"
env_logger = "0.11.8"
log = "0.4.27"
percent-encoding = "2.3.1"
rand = "0.9.2"
sha1 = "0.10.6"
tokio = { version = "1.47.1", features = ["net", "rt-multi-thread"] }
ureq = "3.0.12"
urlencoding = "2.1.3"
tokio-util = { version = "0.7", features = ["codec"] }

[workspace.lints.clippy]
nested_imports = "warn"

[dev-dependencies]
ctor = "0.5.0"
